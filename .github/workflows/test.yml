# Build the page and run the JS tests on every push and pull request. The Python cross-check
# (tests/check_browser_json.py) is left out: it imports chess-animator, which needs Manim.
name: test
on: [push, pull_request]
# the job only reads the repo
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: node build.cjs
      - run: node --test --test-concurrency=1 tests/*.test.cjs
