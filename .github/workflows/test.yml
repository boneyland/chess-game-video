# Build the page and run the JS tests on every push and pull request, and the browser smoke tests against the build.
# The Python cross-check (tests/check_browser_json.py) is left out: it imports chess-animator, which needs Manim.
name: test
on: [push, pull_request]
# the job only reads the repo
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: node build.cjs
      - run: node --test --test-concurrency=1 tests/*.test.cjs
  # The smoke tests (tests/live/site.test.cjs) against this commit's build, served the way render.yaml has Render
  # serve it, in the runner's own Google Chrome and Firefox (Firefox over WebDriver BiDi): no browser download
  browsers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock playwright@1.63.0
      - run: |
          google-chrome --version && firefox --version
          echo "FIREFOX_PATH=$(readlink -f "$(command -v firefox)")" >> "$GITHUB_ENV"
      - run: node --test tests/live/site.test.cjs
        env:
          LIVE_URLS: local
          CHROMIUM_CHANNEL: chrome
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: screenshots
          path: tests/out/live/
