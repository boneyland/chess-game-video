# The Render static site (chess-replay). The service is linked to a Blueprint, so Render syncs these settings
# from this file on each push to main; edit them here rather than in the dashboard.
services:
  - type: web
    name: chess-replay
    runtime: static
    # the tests run first, so a failing push doesn't go live
    buildCommand: node --test --test-concurrency=1 tests/*.test.cjs && node build.cjs
    staticPublishPath: out/site
    envVars:
      - key: NODE_VERSION
        value: "22"
    # only changes to what goes into the page trigger a deploy (as netlify.toml's ignore rule)
    buildFilter:
      paths:
        - app/**
        - src/**
        - vendor/**
        - openings/**
        - babel/**
        - openings-data.cjs
        - build.cjs
        - render.yaml
    # the bare domain serves the app; its file name stays the same as on the old notes site
    routes:
      - type: rewrite
        source: /
        destination: /chess-game-video.html
    # revalidate on every visit, so a deploy is live at once
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
